# vim:fileencoding=utf-8
#
# Browse every available option with `just kitty-defaults` (generated from
# the installed kitty), ctrl+shift+f3 for the command palette, or
# ctrl+shift+f1 for the docs.

# Fonts

# BEGIN_KITTY_FONTS
font_family      family="FiraCode Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

font_size 13.0
disable_ligatures always

# Text cursor customization

cursor_shape beam
cursor_blink_interval 0

# Scrollback

scrollback_lines 10000
scrollback_pager less -QRSix4 +INPUT_LINE_NUMBER
scrollback_pager_history_size 10

# Terminal bell

enable_audio_bell no

# Window layout

enabled_layouts tall:bias=65;full_size=1;mirrored=true, fat, stack
map kitty_mod+d toggle_layout stack

window_border_width 1.0pt
draw_minimal_borders no
single_window_margin_width 3
placement_strategy top-left
hide_window_decorations titlebar-only

# Tab bar

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{index}) {title}"

# Advanced

shell /opt/homebrew/bin/fish
allow_remote_control socket-only
listen_on unix:/tmp/mykitty

# OS specific tweaks

macos_option_as_alt left
macos_quit_when_last_window_closed yes
macos_show_window_title_in none

# Keyboard shortcuts

map kitty_mod+m>c create_marker
map kitty_mod+m>d remove_marker
map kitty_mod+m>n scroll_to_mark next
map kitty_mod+m>p scroll_to_mark prev

# Window management

map kitty_mod+enter launch --cwd=current
map cmd+enter       launch --cwd=current

# TODO: set up splits layout
# enabled_layouts splits, stack
# map kitty_mod+enter launch --location=hsplit
# map kitty_mod+alt+enter launch --location=vsplit

# # map kitty_mod+s no_op
# map kitty_mod+i     launch --location=split
# # map kitty_mod+s     launch --cwd=current --location=hsplit
# map kitty_mod+o     launch --cwd=current --location=vsplit

# Move the active window in the indicated direction
# map shift+up move_window up
# map shift+left move_window left
# map shift+right move_window right
# map shift+down move_window down
#
# # Move the active window to the indicated screen edge
# map ctrl+shift+up layout_action move_to_screen_edge top
# map ctrl+shift+left layout_action move_to_screen_edge left
# map ctrl+shift+right layout_action move_to_screen_edge right
# map ctrl+shift+down layout_action move_to_screen_edge bottom
#
# # Switch focus to the neighboring window in the indicated direction
# map ctrl+left neighboring_window left
# map ctrl+right neighboring_window right
# map ctrl+up neighboring_window up
# map ctrl+down neighboring_window down

map kitty_mod+n new_os_window_with_cwd
map cmd+n       new_os_window_with_cwd

map shift+cmd+d no_op

# Next window

map cmd+] next_window

# Previous window

map cmd+[ previous_window

# Tab management

map kitty_mod+t new_tab_with_cwd
map cmd+t new_tab_with_cwd

map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9
map kitty_mod+0 goto_tab 0

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+0 goto_tab 0

# Font sizes

map kitty_mod+equal  change_font_size all +1.0
map kitty_mod+plus   change_font_size all +1.0
map kitty_mod+kp_add change_font_size all +1.0
map cmd+plus         change_font_size all +1.0
map cmd+equal        change_font_size all +1.0
map shift+cmd+equal  change_font_size all +1.0

map kitty_mod+minus       change_font_size all -1.0
map kitty_mod+kp_subtract change_font_size all -1.0
map cmd+minus             change_font_size all -1.0
map shift+cmd+minus       change_font_size all -1.0

# Select and act on visible text

map kitty_mod+p>f kitten hints --type path --program -
map kitty_mod+p>alt+f kitten hints --type path --program @
map kitty_mod+p>shift+f kitten hints --type path --multiple --program -
map kitty_mod+p>shift+alt+f kitten hints --type path --multiple --program @

map kitty_mod+p>l kitten hints --type line --program -
map kitty_mod+p>alt+l kitten hints --type line --program @
map kitty_mod+p>shift+l kitten hints --type line --multiple --program -
map kitty_mod+p>shift+alt+l kitten hints --type line --multiple --program @

map kitty_mod+p>w kitten hints --type word --program -
map kitty_mod+p>alt+w kitten hints --type word --program @
map kitty_mod+p>shift+w kitten hints --type word --multiple --program -
map kitty_mod+p>shift+alt+w kitten hints --type word --multiple --program @

map kitty_mod+p>h kitten hints --type hash --program -
map kitty_mod+p>alt+h kitten hints --type hash --program @
map kitty_mod+p>shift+h kitten hints --type hash --multiple --program -
map kitty_mod+p>shift+alt+h kitten hints --type hash --multiple --program @

# Open selected path
# map kitty_mod+p>o kitten hints --type linenum nvim +{line} {path}
# map kitty_mod+p>o kitten hints --type path --program "launch --type=overlay-main nvim"
# map kitty_mod+p>shift+o kitten hints --type path --multiple --program "launch --type=overlay-main nvim"

map kitty_mod+p>i kitten hints --type ip --program -
map kitty_mod+p>alt+i kitten hints --type ip --program @
map kitty_mod+p>shift+i kitten hints --type ip --multiple --program -
map kitty_mod+p>shift+alt+i kitten hints --type ip --multiple --program @

map kitty_mod+p>u kitten hints --type url --program -
map kitty_mod+p>alt+u kitten hints --type url --program @
map kitty_mod+p>shift+u kitten hints --type url --multiple --program -
map kitty_mod+p>shift+alt+u kitten hints --type url --multiple --program @

# Miscellaneous

map cmd+, launch --type=os-window --cwd=~/.dotfiles fish -c 'nvim config/kitty/kitty.conf'

# Shift+Enter for newline in Claude code
map shift+enter send_text all \e\r

include kitty.os.conf
include kitty.local.conf

# BEGIN_KITTY_THEME
# Ayu Mirage
include current-theme.conf
# END_KITTY_THEME
